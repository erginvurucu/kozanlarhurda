<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kozanlar Hurda">
  <!--
    Favicon: fosforlu yesil isik. Panel, cerceve veya harf yok -
    16 pikselde en net okunan bicim dolu bir daire.
    Merkeze dogru hafif acilan gradyan, duz lekeye benzemesin diye;
    renk yine de bastan sona parlak yesil.
  -->
  <defs>
    <radialGradient id="neon" cx="42%" cy="38%" r="68%">
      <stop offset="0%"   stop-color="#9BFF6E" />
      <stop offset="45%"  stop-color="#39FF14" />
      <stop offset="100%" stop-color="#17D400" />
    </radialGradient>
  </defs>

  <circle cx="32" cy="32" r="31" fill="url(#neon)" />
</svg>
